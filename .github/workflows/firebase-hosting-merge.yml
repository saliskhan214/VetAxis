name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VETAXIS360 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Validating Service Account credentials..."
            SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
            export SA_FILE
            node -e "
              try {
                const creds = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
                if (!creds.project_id || !creds.private_key) {
                  throw new Error('Missing project_id or private_key in credentials');
                }
                const fs = require('fs');
                fs.writeFileSync(process.env.SA_FILE, JSON.stringify(creds, null, 2));
                console.log('Service account parsed successfully for project: ' + creds.project_id);
              } catch (e) {
                console.error('Failed to parse service account JSON:', e.message);
                process.exit(1);
              }
            "
            export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
            echo "Deploying to Firebase Hosting for project vetaxis360..."
            npx --yes firebase-tools deploy --only hosting --project vetaxis360 --non-interactive
            rm -f "$SA_FILE"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase Hosting with Firebase Token..."
            npx --yes firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project vetaxis360 --non-interactive
          else
            echo "::warning ::Firebase deployment credentials are not configured in GitHub Secrets. Build succeeded, but deployment was skipped."
            echo "### ⚠️ Firebase Deployment Notice" >> $GITHUB_STEP_SUMMARY
            echo "The project was compiled and built successfully! However, deployment to Firebase Hosting was skipped because the repository secret is not configured in GitHub." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### To enable automatic deployment to Firebase Hosting:" >> $GITHUB_STEP_SUMMARY
            echo "1. In your GitHub repository, open **Settings** > **Secrets and variables** > **Actions**." >> $GITHUB_STEP_SUMMARY
            echo "2. Click **New repository secret**." >> $GITHUB_STEP_SUMMARY
            echo "3. Name: \`FIREBASE_SERVICE_ACCOUNT_VETAXIS360\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Secret value: Paste your Firebase/Google Cloud Service Account JSON key." >> $GITHUB_STEP_SUMMARY
          fi

