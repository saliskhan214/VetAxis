plugins {
    id 'com.android.application'
}

// Configurable semantic versioning strategy
def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 2
def appVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0.1"

android {
    namespace 'com.vetaxis.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vetaxis.app"
        
        // minSdk 21 (Android 5.0 Lollipop) ensures broad compatibility across older rural devices and rugged farm tablets
        minSdk 21
        targetSdk 34
        
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.0'
}

// Pre-packaging task: synchronizes compiled JavaScript bundle & static web files into Android assets folder
task packageWebBundle(type: Copy) {
    description = "Pre-packages the compiled JavaScript/HTML web distribution into the Android assets directory before APK generation"
    
    doFirst {
        file("${projectDir}/src/main/assets").mkdirs()
    }
    
    from("${rootDir}/../dist") {
        exclude "downloads/**"
        exclude "server.cjs*"
    }
    into("${projectDir}/src/main/assets")
}

// Bind packaging task to Gradle preBuild and asset merging lifecycles
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn packageWebBundle
}
preBuild.dependsOn packageWebBundle
